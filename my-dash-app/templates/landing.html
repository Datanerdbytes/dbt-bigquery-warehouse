<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quantum Echo · Business analytics & pipeline visibility</title>
    <meta
      name="description"
      content="Explore business performance and the data pipelines behind it. Quantum Echo brings sales analytics, customer insights, and pipeline observability into one workspace."
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/assets/00-theme.css" />
    <link rel="stylesheet" href="/assets/08-auth.css" />
    {% if csp_nonce %}
    <meta name="csp-nonce" content="{{ csp_nonce }}">
    {% endif %}
    <script nonce="{{ csp_nonce }}" defer src="/assets/showcase.bundle.js"></script>
  </head>
  <body class="landing-page">
    <a class="landing-skip-link" href="#landing-main"
      >Skip to product overview</a
    >
    <header class="landing-header">
      <a class="landing-brand" href="/" aria-label="Quantum Echo home"
        ><svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <circle cx="15" cy="15" r="11" />
          <path d="m19 19 10 10M11 15h8" /></svg
        ><span>Quantum Echo</span></a
      >
      <nav class="landing-nav" aria-label="Product navigation">
        <a href="#auth-showcase" data-slide="0">Analytics</a
        ><a href="#auth-showcase" data-slide="1">Data pipeline</a>
      </nav>
      <a class="landing-login" href="/login"
        >Login <span aria-hidden="true">↗</span></a
      >
    </header>
    <main id="landing-main">{% include 'showcase.html' %}</main>
    <footer class="landing-footer">
      <span>Business clarity. Data confidence.</span
      ><span>Built with BigQuery & dbt</span>
    </footer>
  </body>
</html>
