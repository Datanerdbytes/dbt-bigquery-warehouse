# --------------------------------------------------------------------
# .pre-commit-config.yaml
# --------------------------------------------------------------------

repos:
  # ==================================================
  # General Repository Hygiene
  # ==================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml

      - id: check-json
        exclude: ^node_modules/

      - id: check-toml

      - id: end-of-file-fixer

      - id: trailing-whitespace

      - id: check-added-large-files

      # Prevent unresolved Git merge conflicts from being committed
      - id: check-merge-conflict

      # Detect accidental breakpoint() / debugger statements
      - id: debug-statements

      # Prevent files whose names conflict on case-insensitive systems
      - id: check-case-conflict

      # Detect broken symbolic links
      - id: check-symlinks


  # ==================================================
  # Security
  # ==================================================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - "--baseline"
          - ".secrets.baseline"
        exclude: src/services/email.spec.py


  # ==================================================
  # dbt Model Quality
  # ==================================================
  # Build a current manifest using an isolated, credential-free parse target.
  # This prerequisite runs before the manifest-consuming dbt quality hooks.
  - repo: local
    hooks:
      - id: prepare-dbt-checks
        name: Prepare dbt manifest (offline parse)
        entry: uv run --locked python Scripts/prepare_dbt_checks.py
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/dbt-checkpoint/dbt-checkpoint
    rev: v2.0.10
    hooks:
      # Require descriptions for dbt models
      - id: check-model-has-description
        files: ^analytics_layer/models/.*\.sql$
        args:
          - "--manifest"
          - "analytics_layer/target/manifest.json"

      # Require at least one test per dbt model
      - id: check-model-has-tests
        files: ^analytics_layer/models/.*\.sql$
        args:
          - "--test-cnt"
          - "1"
          - "--manifest"
          - "analytics_layer/target/manifest.json"

      # Require dbt models to have a properties YAML file
      - id: check-model-has-properties-file
        files: ^analytics_layer/models/.*\.sql$
        args:
          - "--manifest"
          - "analytics_layer/target/manifest.json"


  # ==================================================
  # Python Linting & Formatting - Ruff
  # ==================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      # Python linting
      - id: ruff-check

      # Python formatting
      - id: ruff-format


  # ==================================================
  # Local Project Quality Checks
  # ==================================================
  - repo: local
    hooks:
      - id: pyrefly-check
        name: Pyrefly (project type checking)
        entry: uv run --locked pyrefly check
        language: system
        pass_filenames: false
        always_run: true

      # ------------------------------------------------
      # Python Tests
      # ------------------------------------------------
      - id: run-pytest
        name: Run Pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true

      # ------------------------------------------------
      # dbt SQL Linting
      # ------------------------------------------------
      - id: sqlfluff-lint
        name: SQLFluff Lint (dbt models)
        entry: uv run sqlfluff lint analytics_layer/models/
        language: system
        files: ^analytics_layer/models/.*\.sql$
        pass_filenames: false
