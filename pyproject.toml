[project]
name = "demo-database"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "QuantumEcho", email = "datanerdbytes@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dash>=4.4.1",
    "dash-mantine-components>=2.8.0",
    "dbt-bigquery>=1.12.0",
