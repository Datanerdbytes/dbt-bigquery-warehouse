[project]
name = "demo-database"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "QuantumEcho", email = "datanerdbytes@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dash>=4.4.1",
    "dash-ag-grid>=35.3.0",
    "dash-bootstrap-components>=2.0.4",
    "dash-mantine-components>=2.8.0",
    "dbt>=2.0.0rc212",
    "dbt-bigquery>=1.12.0",
    "flask-caching>=2.5.1",
    "flask-limiter>=3.11.0",
    "google-cloud-bigquery-storage>=2.41.0",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pre-commit>=4.6.2",
    "pyarrow>=25.0.1",
    "pycountry==24.6.1",
    "pyodbc>=5.3.0",
    "sqlalchemy>=2.0.52",
    "sqlfluff>=4.3.0",
    "sqlfluff-templater-dbt>=4.3.0",
]

[project.scripts]
demo-database = "demo_database:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dbt-bigquery>=1.12.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "sqlfluff>=4.3.0",
    "sqlfluff-templater-dbt>=4.3.0",
]

[tool.pyright]
include = ["my-dash-app", "Scripts"]
exclude = ["**/node_modules", "**/.venv", "**/analytics_layer"]
venvPath = "."
venv = ".venv"

# Type Checking Strictness
typeCheckingMode = "basic"

# Complete silencing of third-party type inference bugs
reportArgumentType = "none"
reportCallIssue = "none"
reportAttributeAccessIssue = "none"
reportOptionalMemberAccess = "none"
reportGeneralTypeIssues = "none"
reportPrivateUsage = "none"

[tool.ruff]
extend-exclude = [
    ".agents",
    "Notebooks",
]
force-exclude = true

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

ignore = [
    "E501",  # Line length is handled by Ruff formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
