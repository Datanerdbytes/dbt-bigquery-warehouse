name: CI/CD Data & Analytics Pipeline

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'SKILL.md'
      - 'docs/**'
      - 'Notebooks/**'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'SKILL.md'
      - 'docs/**'
      - 'Notebooks/**'

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv python install 3.12
          uv sync --locked

      - name: Check project types with locked Pyrefly
        run: uv run --locked pyrefly check

      - name: Set up Node for authentication build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build and test dashboard authentication offline
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build:auth
          npm run test:auth
          uv run python -B -m unittest discover -s tests -v

      - name: Build bronze and run the dbt pipeline offline
        # The BigQuery warehouse was retired, so CI rebuilds the same models
        # against a local DuckDB file. No warehouse credentials are involved:
        # the bronze tables are loaded from the versioned source CSVs.
        run: |
          set -euo pipefail
          uv run --locked python -B Scripts/load_bronze_duckdb.py --fresh
          cd analytics_layer
          ../.venv/bin/dbt deps
          ../.venv/bin/dbt build --profiles-dir .

      - name: Verify the shipped gold artifact matches the build
        run: uv run --locked python -B Scripts/verify_shipped_gold.py

      - name: Verify the shipped pipeline telemetry matches the build
        # The pipeline health views read a committed JSON artifact instead of
        # the retired warehouse. It must be re-exported whenever the models,
        # the tests or the bronze sources change.
        run: |
          set -euo pipefail
          uv run --locked python -B Scripts/export_pipeline_telemetry.py \
            --out "$RUNNER_TEMP/pipeline_telemetry.json"
          uv run --locked python -B Scripts/verify_shipped_telemetry.py \
            --built "$RUNNER_TEMP/pipeline_telemetry.json"

  deploy:
    needs: [validate-and-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to the canonical Vercel project
        # The repository is connected to dbt-bigquery-warehouse, so its
        # hostname dbt-bigquery-warehouse.vercel.app is the canonical
        # production host.
        run: vercel --prod --yes --project dbt-bigquery-warehouse

      - name: Deploy to the legacy Vercel project
        # adventureworks-analytics still owns the two hostnames that Google
        # Safe Browsing has flagged. Its automatic alias cannot be moved to
        # another project, so it keeps serving the app until the appeal
        # resolves and the hostnames are retired.
        run: vercel --prod --yes --project adventureworks-analytics
