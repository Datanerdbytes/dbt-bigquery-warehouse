name: CI/CD Data & Analytics Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup uv
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      # 3. Install Dependencies
      - name: Install dependencies
        run: |
          uv python install 3.12
          uv sync

      # 4. Authenticate GCP Service Account Key & Generate CI profiles.yml
      - name: Setup GCP & dbt Profile
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          # Save GCP key
          echo "$GCP_SA_KEY" > /tmp/gcp_key.json
          
          # Fallback to default project ID if secret is unset
          PROJ_ID="${GCP_PROJECT_ID:-quantum-echo-data-eng-prod}"
          
          # Create temporary .dbt directory in runner home
          mkdir -p ~/.dbt

          # Dynamically write profiles.yml
          cat <<EOF > ~/.dbt/profiles.yml
          analytics_layer:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: "$PROJ_ID"
                dataset: silver
                keyfile: /tmp/gcp_key.json
                location: us-central1
                threads: 4
                job_execution_timeout_seconds: 300
                job_retries: 1
                priority: interactive
          EOF

      # 5. Run dbt Model Compilation & Assertion Tests
      - name: Run dbt Compile & Test
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_KEY_PATH: /tmp/gcp_key.json
        run: |
          cd analytics_layer
          ../.venv/bin/dbt compile
          ../.venv/bin/dbt test

      # 6. Clean up Credentials
      - name: Cleanup Service Account Key & Profile
        if: always()
        run: |
          rm -f /tmp/gcp_key.json
          rm -rf ~/.dbt
