name: CI/CD Data & Analytics Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync

      - name: Authenticate to GCP
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: echo "$GCP_SA_KEY" > /tmp/gcp_key.json

      - name: Run dbt Compile & Test
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_KEY_PATH: /tmp/gcp_key.json
        run: |
          cd analytics_layer
          uv run dbt compile
          uv run dbt test

      - name: Cleanup Service Account Key
        if: always()
        run: rm -f /tmp/gcp_key.json