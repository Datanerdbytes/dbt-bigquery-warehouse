name: CI/CD Data & Analytics Pipeline

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'SKILL.md'
      - 'docs/**'
      - 'Notebooks/**'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'SKILL.md'
      - 'docs/**'
      - 'Notebooks/**'

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv python install 3.12
          uv sync

      - name: Setup GCP & dbt Profile
        env:
          GCP_SA_KEY: ${{ secrets.GCP }}
          GCP_PROJECT_ID: quantum-echo-data-eng-prod
        run: |
          echo "Secret length check: ${#GCP_SA_KEY} characters"

          if [ -z "$GCP_SA_KEY" ]; then
            echo "❌ ERROR: secrets.GCP_SA_KEY is empty or unavailable in this runner context."
            echo "Ensure the secret 'GCP_SA_KEY' is created under Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi

          python3 -c "
          import os, json
          key_str = os.environ.get('GCP_SA_KEY', '')
          data = json.loads(key_str)
          with open('/tmp/gcp_key.json', 'w') as f:
              json.dump(data, f)
          print('✅ GCP Service Account Key written and validated successfully.')
          "

          PROJ_ID="${GCP_PROJECT_ID:-quantum-echo-data-eng-prod}"

          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          analytics_layer:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: "$PROJ_ID"
                dataset: silver
                keyfile: /tmp/gcp_key.json
                location: us-central1
                threads: 4
                job_execution_timeout_seconds: 300
                job_retries: 1
                priority: interactive
          EOF

      - name: Run dbt Compile & Test
        run: |
          cd analytics_layer
          ../.venv/bin/dbt deps
          ../.venv/bin/dbt compile
          ../.venv/bin/dbt test

      - name: Cleanup Service Account Key & Profile
        if: always()
        run: |
          rm -f /tmp/gcp_key.json
          rm -rf ~/.dbt

  deploy-cloud-run:
    needs: validate-and-test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG="us-central1-docker.pkg.dev/quantum-echo-data-eng-prod/dash-repo/dash-observability-app:${{ github.sha }}"
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: dash-observability-app
          region: us-central1
          image: us-central1-docker.pkg.dev/quantum-echo-data-eng-prod/dash-repo/dash-observability-app:${{ github.sha }}
          flags: |
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=2
            --allow-unauthenticated
