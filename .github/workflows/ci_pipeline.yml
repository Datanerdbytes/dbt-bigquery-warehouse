name: CI/CD Data & Analytics Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup uv
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      # 3. Install Dependencies
      - name: Install dependencies
        run: |
          uv python install 3.12
          uv sync

      # 4. Authenticate GCP Service Account Key & Validate JSON
      - name: Setup GCP & dbt Profile
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          # Write secret key to file
          echo "$GCP_SA_KEY" > /tmp/gcp_key.json

          # Fail-fast check: Ensure file is not empty and is valid JSON
          if [ ! -s /tmp/gcp_key.json ]; then
            echo "❌ ERROR: /tmp/gcp_key.json is empty. Check GitHub Secret GCP_SA_KEY."
            exit 1
          fi

          python -c "import json; json.load(open('/tmp/gcp_key.json'))" || {
            echo "❌ ERROR: /tmp/gcp_key.json is not valid JSON."
            exit 1
          }

          echo "✅ GCP Service Account Key validated successfully."

          # Fallback project ID
          PROJ_ID="${GCP_PROJECT_ID:-quantum-echo-data-eng-prod}"

          # Create .dbt directory and write profiles.yml
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          analytics_layer:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: "$PROJ_ID"
                dataset: silver
                keyfile: /tmp/gcp_key.json
                location: us-central1
                threads: 4
                job_execution_timeout_seconds: 300
                job_retries: 1
                priority: interactive
          EOF

      # 5. Run dbt Model Compilation & Assertion Tests
      - name: Run dbt Compile & Test
        run: |
          cd analytics_layer
          ../.venv/bin/dbt compile
          ../.venv/bin/dbt test

      # 6. Clean up Credentials
      - name: Cleanup Service Account Key & Profile
        if: always()
        run: |
          rm -f /tmp/gcp_key.json
          rm -rf ~/.dbt
