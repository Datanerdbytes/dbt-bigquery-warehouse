name: CI/CD Data & Analytics Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup uv (Handles Python installation & PATH automatically)
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 3. Install Dependencies
      - name: Install Project Dependencies
        run: |
          uv python install 3.12
          uv sync

      # 4. Authenticate GCP Service Account Key
      - name: Authenticate to GCP
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_SA_KEY" > /tmp/gcp_key.json

      # 5. Run dbt Model Compilation & Assertion Tests
      - name: Run dbt Compile & Test
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_KEY_PATH: /tmp/gcp_key.json
        run: |
          cd analytics_layer
          uv run dbt compile
          uv run dbt test

      # 6. Clean up Credentials
      - name: Cleanup Service Account Key
        if: always()
        run: rm -f /tmp/gcp_key.json